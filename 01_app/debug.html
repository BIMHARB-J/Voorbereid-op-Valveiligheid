<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>EP Debug - format varianten</title>
<style>
  body { font-family: monospace; background: #0d0f14; color: #e2e8f0; padding: 20px; font-size: 12px; }
  h2 { color: #00c8ff; margin: 12px 0 4px; }
  .r { background: #161a22; border: 1px solid #252b38; border-radius: 6px; padding: 10px; margin: 4px 0 10px; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; }
  .ok { border-color: #22c55e; } .err { border-color: #ef4444; color: #ef4444; }
  button { background: #00c8ff; color: #000; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>
<h1 style="color:#00c8ff">EP Debug — format varianten + origineel bestand</h1>
<div id="st">Verbinden...</div><br>
<button onclick="run()">▶ Test alle format opties</button>
<div id="out"></div>
<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<script>
const PROXY = 'https://edgeprotector.jja-hoven.workers.dev';
let token, pid, region, fileId;

function add(label, status, body) {
  const ok = status >= 200 && status < 300;
  document.getElementById('out').innerHTML +=
    `<h2>${label} → HTTP ${status}</h2>
     <div class="r ${ok?'ok':'err'}">${typeof body==='string'?body.substring(0,500):JSON.stringify(body,null,2)}</div>`;
}

async function get(path) {
  const r = await fetch(`${PROXY}/api${path}?region=${region}`, {
    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
  });
  let b; try { b = await r.json(); } catch { b = await r.text(); }
  return { status: r.status, body: b };
}

async function run() {
  document.getElementById('out').innerHTML = '';

  // Test alle mogelijke format waarden
  const formats = ['trb', 'original', 'ifc', 'ifczip', 'source', 'native', 'raw', 'upload'];
  for (const fmt of formats) {
    const r = await get(`/files/fs/${fileId}/downloadurl?versionId=${fileId}&format=${fmt}`);
    const hasUrl = r.status === 200 && (r.body.uploadURL || r.body.url || r.body.downloadURL);
    add(
      `/files/fs/${fileId}/downloadurl?format=${fmt}${hasUrl ? ' ✓' : ''}`,
      r.status,
      r.body
    );
  }

  // Test ook zonder format parameter
  const r0 = await get(`/files/fs/${fileId}/downloadurl?versionId=${fileId}`);
  add(`/files/fs/${fileId}/downloadurl (geen format)`, r0.status, r0.body);

  // Kijk of er een apart "versions" endpoint is met het originele bestand
  const rv = await get(`/files/${fileId}/versions`);
  add(`/files/${fileId}/versions`, rv.status, rv.body);
}

(async () => {
  try {
    const API = await TrimbleConnectWorkspace.connect(window.parent, (e,d) => {
      if (e==='extension.accessToken' && d && d!=='pending') token=d;
    });
    const t = await API.extension.requestPermission('accesstoken');
    if (t && t!=='pending' && t!=='denied') token = t;
    const p = await API.project.getProject();
    pid    = p.id;
    region = (p.location||'europe').toLowerCase().split(' ')[0];
    const viewer = await API.viewer;
    const models = await viewer.getModels();
    fileId = models[0].id;
    document.getElementById('st').textContent = `✓ file: ${models[0].name} (${fileId})`;
    document.getElementById('st').style.color = '#22c55e';
  } catch(e) {
    document.getElementById('st').textContent = 'Fout: ' + e.message;
    document.getElementById('st').style.color = '#ef4444';
  }
})();
</script>
</body>
</html>
