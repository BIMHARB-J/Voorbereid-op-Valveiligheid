<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>EP Debug v11 - fileservice URL</title>
<style>
  body { font-family: monospace; background: #0d0f14; color: #e2e8f0; padding: 20px; font-size: 12px; }
  h2 { color: #00c8ff; margin: 12px 0 4px; }
  .r { background: #161a22; border: 1px solid #252b38; border-radius: 6px; padding: 10px; margin: 4px 0 10px; white-space: pre-wrap; word-break: break-all; max-height: 250px; overflow-y: auto; }
  .ok { border-color: #22c55e; } .err { border-color: #ef4444; color: #ef4444; }
  button { background: #00c8ff; color: #000; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; margin: 4px 2px; }
</style>
</head>
<body>
<h1 style="color:#00c8ff">EP Debug v11 — fileservice URL ophalen</h1>
<div id="st">Verbinden...</div><br>
<button onclick="run()">▶ Test endpoints die fileservice URL teruggeven</button>
<div id="out"></div>

<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<script>
const PROXY = 'https://edgeprotector.jja-hoven.workers.dev';
let token, pid, region, fileId;

function add(label, status, body) {
  const ok = status >= 200 && status < 300;
  document.getElementById('out').innerHTML +=
    `<h2>${label} → HTTP ${status}</h2>
     <div class="r ${ok?'ok':'err'}">${typeof body==='string'?body.substring(0,1000):JSON.stringify(body,null,2)}</div>`;
}

async function get(path, headers) {
  const r = await fetch(`${PROXY}/api${path}?region=${region}`, {
    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json', ...(headers||{}) },
    redirect: 'follow'
  });
  // Check of response een URL bevat (fileservice URL)
  const ct = r.headers.get('content-type') || '';
  if (ct.includes('octet')) {
    const ab = await r.arrayBuffer();
    return { status: r.status, body: `BINARY DATA: ${ab.byteLength} bytes ✓`, binary: ab };
  }
  let b; try { b = await r.json(); } catch { b = await r.text(); }
  return { status: r.status, body: b };
}

async function run() {
  document.getElementById('out').innerHTML = '';

  // De download URL structuur is:
  // https://eu-aws-ro.fileservice.trimblecloud.com/fs_s/{filespaceId}.{fileId}?Policy=...
  // filespaceId = cfe7db01-88f2-48ae-96bb-e9d9bc02e85c (uit project response)
  // fileId = GCipjwqd3JM

  // Welk endpoint geeft deze pre-signed URL terug?
  // Kandidaten:
  const paths = [
    // Transfer endpoint (gebruikt door Trimble intern)
    `/files/${fileId}/transfer`,
    `/files/${fileId}/transfers`,
    // CDN / storage URL
    `/files/${fileId}/storageurl`,
    `/files/${fileId}/cdnurl`,
    `/files/${fileId}/fileserviceurl`,
    // Download via de nieuwe fileservice API
    `/storage/files/${fileId}`,
    `/storage/files/${fileId}/download`,
    // Via filespace ID direct
    `/filespaces/${fileId}/download`,
    // WOPI met juiste header
    { path: `/wopi/files/${fileId}/contents`, h: { 'X-WOPI-Override': 'GET_FILE' } },
    // GET met redirect=false om Location te zien
    { path: `/files/${fileId}`, h: { 'Accept': 'application/octet-stream' }, manual: true },
  ];

  for (const item of paths) {
    const path   = typeof item === 'string' ? item : item.path;
    const xhdrs  = (typeof item === 'object' && item.h) ? item.h : {};
    const manual = typeof item === 'object' && item.manual;

    try {
      if (manual) {
        // Gebruik redirect: manual in de worker kan niet, maar we kunnen
        // een speciale hint meesturen
        const r = await fetch(`${PROXY}/api${path}?region=${region}&_manual=1`, {
          headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/octet-stream' }
        });
        const ct = r.headers.get('content-type') || '';
        const loc = r.headers.get('location') || 'geen location header';
        const bytes = await r.arrayBuffer();
        add(`${path} (octet-stream, ${bytes.byteLength} bytes, location: ${loc})`, r.status, ct);
      } else {
        const r = await get(path, xhdrs);
        // Check of de response body een fileservice URL bevat
        const bodyStr = JSON.stringify(r.body);
        const hasUrl = bodyStr.includes('fileservice') || bodyStr.includes('trimblecloud') || bodyStr.includes('Policy=');
        add(path + (hasUrl ? ' ✓ FILESERVICE URL GEVONDEN!' : ''), r.status, r.body);
      }
    } catch(e) {
      add(path, 'FOUT', e.message);
    }
  }
}

(async () => {
  try {
    const API = await TrimbleConnectWorkspace.connect(window.parent, (e,d) => {
      if (e==='extension.accessToken' && d && d!=='pending') token=d;
    });
    const t = await API.extension.requestPermission('accesstoken');
    if (t && t!=='pending' && t!=='denied') token = t;
    const p = await API.project.getProject();
    pid    = p.id;
    region = (p.location||'europe').toLowerCase().split(' ')[0];
    const viewer = await API.viewer;
    const models = await viewer.getModels();
    fileId = models[0].id;
    document.getElementById('st').textContent = `✓ file: ${models[0].name} (${fileId})`;
    document.getElementById('st').style.color = '#22c55e';
  } catch(e) {
    document.getElementById('st').textContent = 'Fout: ' + e.message;
    document.getElementById('st').style.color = '#ef4444';
  }
})();
</script>
</body>
</html>
