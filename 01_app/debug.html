<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>EP Debug v5 - Download endpoints</title>
<style>
  body { font-family: monospace; background: #0d0f14; color: #e2e8f0; padding: 20px; font-size: 12px; }
  h2 { color: #00c8ff; margin: 12px 0 4px; }
  .r { background: #161a22; border: 1px solid #252b38; border-radius: 6px; padding: 10px; margin: 4px 0 10px; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; }
  .ok { border-color: #22c55e; }
  .err { border-color: #ef4444; color: #ef4444; }
  button { background: #00c8ff; color: #000; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; margin: 4px 2px; }
</style>
</head>
<body>
<h1 style="color:#00c8ff">EP Debug v5 — Download endpoints</h1>
<div id="st">Verbinden...</div><br>
<button onclick="run()">▶ Test alle download endpoints</button>
<div id="out"></div>

<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<script>
const PROXY = 'https://edgeprotector.jja-hoven.workers.dev';
let token, pid, region, fileId, projectId;

function add(label, status, body) {
  const ok = status >= 200 && status < 300;
  document.getElementById('out').innerHTML +=
    `<h2>${label} → HTTP ${status}</h2>
     <div class="r ${ok?'ok':'err'}">${typeof body==='string'?body:JSON.stringify(body,null,2)}</div>`;
}

async function get(path) {
  const r = await fetch(`${PROXY}/api${path}?region=${region}`, {
    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
  });
  let b; try { b = await r.json(); } catch { b = await r.text(); }
  return { status: r.status, body: b };
}

async function run() {
  document.getElementById('out').innerHTML = '';

  // Alle mogelijke download-gerelateerde endpoints voor één file
  const fid = fileId; // bijv. GCipjwqd3JM
  const pid2 = pid;

  const paths = [
    // Zonder /projects/ prefix
    `/files/${fid}/downloadlink`,
    `/files/${fid}/binarydata`,
    `/files/${fid}/download`,
    `/files/${fid}/versions/latest/downloadlink`,
    `/files/${fid}/versions/latest/binarydata`,
    `/files/${fid}`,
    // Met /projects/ prefix
    `/projects/${pid2}/files/${fid}/downloadlink`,
    `/projects/${pid2}/files/${fid}/versions/latest/downloadlink`,
    `/projects/${pid2}/files/${fid}/binarydata`,
    `/projects/${pid2}/files/${fid}`,
    // fileversions endpoint
    `/fileversions/${fid}/downloadlink`,
    `/fileversions/${fid}/binarydata`,
    `/fileversions/${fid}`,
  ];

  for (const p of paths) {
    const r = await get(p);
    add(p, r.status, r.body);
  }
}

(async () => {
  try {
    const API = await TrimbleConnectWorkspace.connect(window.parent, (e,d) => {
      if (e==='extension.accessToken' && d && d!=='pending') token=d;
    });
    const t = await API.extension.requestPermission('accesstoken');
    if (t && t!=='pending' && t!=='denied') token = t;
    const p = await API.project.getProject();
    pid    = p.id;
    region = (p.location||'europe').toLowerCase().split(' ')[0];

    // Eerste model uit viewer pakken
    const viewer = await API.viewer;
    const models = await viewer.getModels();
    fileId = models[0].id;
    const name = models[0].name;

    document.getElementById('st').textContent =
      `✓ project: ${p.name} | file: ${name} (${fileId}) | regio: ${region}`;
    document.getElementById('st').style.color = '#22c55e';
  } catch(e) {
    document.getElementById('st').textContent = 'Fout: ' + e.message;
    document.getElementById('st').style.color = '#ef4444';
  }
})();
</script>
</body>
</html>
