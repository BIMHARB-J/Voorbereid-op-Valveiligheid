<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>EP Debug v9 - apidoc scan</title>
<style>
  body { font-family: monospace; background: #0d0f14; color: #e2e8f0; padding: 20px; font-size: 12px; }
  h2 { color: #00c8ff; margin: 12px 0 4px; }
  .r { background: #161a22; border: 1px solid #252b38; border-radius: 6px; padding: 10px; margin: 4px 0 10px; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; }
  .ok { border-color: #22c55e; } .err { border-color: #ef4444; color: #ef4444; }
  button { background: #00c8ff; color: #000; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; margin: 4px 2px; }
</style>
</head>
<body>
<h1 style="color:#00c8ff">EP Debug v9</h1>
<div id="st">Verbinden...</div><br>
<button onclick="run()">▶ Test download endpoints (apidoc-gebaseerd)</button>
<div id="out"></div>

<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<script>
const PROXY = 'https://edgeprotector.jja-hoven.workers.dev';
let token, pid, region, fileId, parentId;

function add(label, status, body) {
  const ok = !status || (status >= 200 && status < 300);
  document.getElementById('out').innerHTML +=
    `<h2>${label}${status?' → HTTP '+status:''}</h2>
     <div class="r ${ok?'ok':'err'}">${typeof body==='string'?body.substring(0,800):JSON.stringify(body,null,2)}</div>`;
}

async function run() {
  document.getElementById('out').innerHTML = '';

  // Officiële Trimble apidoc staat op app21.connect.trimble.com/tc/static/apidoc.html
  // We weten: GET /files/{id}/binarydata is RETIRED
  // Uit SDK: DownloadAsync(file.Identifier) — wat doet dit intern?
  //
  // Nieuwe aanpak: Trimble gebruikt signed /data/{token} URLs
  // Die token genereer je via GET /files/{id}/downloadtoken of /files/{id}/url
  // Of je gebruikt de wopi-api voor file access

  const paths = [
    // Nieuwe file service endpoints (v2 na de retirement)
    `/files/${fileId}/downloadtoken`,
    `/files/${fileId}/url`,
    `/files/${fileId}/link`,
    `/files/${fileId}/signedurl`,
    `/files/${fileId}/tempurl`,
    // WOPI endpoint
    `/wopi/files/${fileId}`,
    `/wopi/files/${fileId}/contents`,
    // Via filespace (we weten filespaceId = cfe7db01-88f2-48ae-96bb-e9d9bc02e85c)
    `/filespaces/cfe7db01-88f2-48ae-96bb-e9d9bc02e85c/files/${fileId}`,
    // De apidoc URL zelf ophalen
    `/../static/apidoc.html`,
  ];

  for (const p of paths) {
    try {
      const r = await fetch(`${PROXY}/api${p}?region=${region}`, {
        headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
      });
      let b;
      if (p.includes('apidoc')) {
        b = (await r.text()).substring(0, 200);
      } else {
        try { b = await r.json(); } catch { b = await r.text(); }
      }
      add(p, r.status, b);
    } catch(e) {
      add(p, 'FOUT', e.message);
    }
  }

  // Extra: probeer de wopi-api-eu direct (CORS verwacht maar geeft status terug)
  try {
    const r = await fetch(`https://wopi-api-eu.connect.trimble.com/v1/files/${fileId}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    let b; try { b = await r.json(); } catch { b = await r.text(); }
    add('WOPI direct: /files/{id}', r.status, b);
  } catch(e) {
    add('WOPI direct (CORS verwacht)', 'CORS', e.message);
  }

  // Extra: probeer de projects-api-eu
  try {
    const r = await fetch(`https://projects-api-eu.connect.trimble.com/v1/projects/${pid}/files/${fileId}/download`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    let b; try { b = await r.json(); } catch { b = await r.text(); }
    add('projects-api-eu direct: /projects/{pid}/files/{fid}/download', r.status, b);
  } catch(e) {
    add('projects-api-eu direct (CORS verwacht)', 'CORS', e.message);
  }
}

(async () => {
  try {
    const API = await TrimbleConnectWorkspace.connect(window.parent, (e,d) => {
      if (e==='extension.accessToken' && d && d!=='pending') token=d;
    });
    const t = await API.extension.requestPermission('accesstoken');
    if (t && t!=='pending' && t!=='denied') token = t;
    const p = await API.project.getProject();
    pid    = p.id;
    region = (p.location||'europe').toLowerCase().split(' ')[0];
    const viewer = await API.viewer;
    const models = await viewer.getModels();
    fileId = models[0].id;
    const fi = await (await fetch(`${PROXY}/api/files/${fileId}?region=${region}`, {
      headers: { 'Authorization': `Bearer ${token}` }
    })).json();
    parentId = fi.parentId;
    document.getElementById('st').textContent = `✓ file: ${models[0].name} (${fileId}) | parentId: ${parentId}`;
    document.getElementById('st').style.color = '#22c55e';
  } catch(e) {
    document.getElementById('st').textContent = 'Fout: ' + e.message;
    document.getElementById('st').style.color = '#ef4444';
  }
})();
</script>
</body>
</html>
