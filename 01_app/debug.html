<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>EP Debug v8</title>
<style>
  body { font-family: monospace; background: #0d0f14; color: #e2e8f0; padding: 20px; font-size: 12px; }
  h2 { color: #00c8ff; margin: 12px 0 4px; }
  .r { background: #161a22; border: 1px solid #252b38; border-radius: 6px; padding: 10px; margin: 4px 0 10px; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; }
  .ok { border-color: #22c55e; } .err { border-color: #ef4444; color: #ef4444; }
  button { background: #00c8ff; color: #000; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; margin: 4px 2px; }
</style>
</head>
<body>
<h1 style="color:#00c8ff">EP Debug v8 — Redirect check + npm SDK</h1>
<div id="st">Verbinden...</div><br>
<button onclick="run()">▶ Test</button>
<div id="out"></div>

<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<script>
const PROXY = 'https://edgeprotector.jja-hoven.workers.dev/api';
let token, pid, region, fileId;

function add(label, status, body) {
  const ok = !status || (status >= 200 && status < 300);
  document.getElementById('out').innerHTML +=
    `<h2>${label}${status?' → HTTP '+status:''}</h2>
     <div class="r ${ok?'ok':'err'}">${typeof body==='string'?body:JSON.stringify(body,null,2)}</div>`;
}

async function run() {
  document.getElementById('out').innerHTML = '';

  // Test 1: redirect-check — ziet de worker een Location header van Trimble?
  const r1 = await fetch(
    `${PROXY}/redirect-check/files/${fileId}?region=${region}`,
    { headers: { 'Authorization': `Bearer ${token}` } }
  );
  const j1 = await r1.json();
  add('Redirect check /files/{id} (octet-stream, manual redirect)', r1.status, j1);

  // Test 2: als Location gevonden, probeer die URL direct te downloaden
  if (j1.location) {
    add('✓ Location header gevonden!', '', j1.location);
    const r2 = await fetch(j1.location);
    const bytes = await r2.arrayBuffer();
    add(`Download via Location URL`, r2.status, `bytes: ${bytes.byteLength}, content-type: ${r2.headers.get('content-type')}`);
  } else {
    add('Geen Location header — Trimble gebruikt geen redirect voor download', '', 
      'Status was: ' + j1.status + '. We moeten een andere aanpak proberen.');
  }

  // Test 3: trimble connect SDK downloaden via npmcdn (als fallback)
  // Probeer de officiële JS SDK die misschien download ondersteunt
  add('Info', '', 
    'Als er geen redirect is, moeten we de file downloaden via de Trimble SDK npm package ' +
    '(trimble-connect-sdk) of via een alternatieve aanpak zoals de "batch download" API.');

  // Test 4: batch download endpoint
  const r4 = await fetch(`${PROXY}/api/batch/download?region=${region}`, {
    method: 'POST',
    headers: { 
      'Authorization': `Bearer ${token}`, 
      'Content-Type': 'application/json',
      'Accept': 'application/json'
    },
    body: JSON.stringify({ fileIds: [fileId] })
  });
  let b4; try { b4 = await r4.json(); } catch { b4 = await r4.text(); }
  add('POST /batch/download', r4.status, b4);

  // Test 5: search-based download — via de search API
  const r5 = await fetch(`${PROXY}/api/files/${fileId}/presignedUrl?region=${region}`, {
    headers: { 'Authorization': `Bearer ${token}` }
  });
  let b5; try { b5 = await r5.json(); } catch { b5 = await r5.text(); }
  add('GET /files/{id}/presignedUrl', r5.status, b5);

  // Test 6: de batch-api heeft een eigen URL (uit regions response)
  // europe batch-api = https://batch-api-eu.connect.trimble.com/v1/
  const r6 = await fetch(`https://batch-api-eu.connect.trimble.com/v1/projects/${pid}/downloads`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ items: [{ fileVersionId: fileId }] })
  }).catch(e => ({ status: 'CORS', json: async () => e.message }));
  let b6; try { b6 = await r6.json(); } catch { b6 = 'CORS geblokkeerd'; }
  add('POST batch-api-eu /projects/{pid}/downloads (direct, CORS verwacht)', r6.status||'CORS', b6);
}

(async () => {
  try {
    const API = await TrimbleConnectWorkspace.connect(window.parent, (e,d) => {
      if (e==='extension.accessToken' && d && d!=='pending') token=d;
    });
    const t = await API.extension.requestPermission('accesstoken');
    if (t && t!=='pending' && t!=='denied') token = t;
    const p = await API.project.getProject();
    pid    = p.id;
    region = (p.location||'europe').toLowerCase().split(' ')[0];
    const viewer = await API.viewer;
    const models = await viewer.getModels();
    fileId = models[0].id;
    document.getElementById('st').textContent = `✓ file: ${models[0].name} (${fileId})`;
    document.getElementById('st').style.color = '#22c55e';
  } catch(e) {
    document.getElementById('st').textContent = 'Fout: ' + e.message;
    document.getElementById('st').style.color = '#ef4444';
  }
})();
</script>
</body>
</html>
