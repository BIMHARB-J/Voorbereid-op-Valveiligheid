<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trimble Connect IFC Viewer - Floor Edges Highlighter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0052a3;
        }
        button.secondary {
            background-color: #666;
        }
        button.secondary:hover {
            background-color: #444;
        }
        button.danger {
            background-color: #d32f2f;
        }
        button.danger:hover {
            background-color: #b71c1c;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 3px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .error {
            color: #d32f2f;
            border-left: 4px solid #d32f2f;
        }
        .success {
            color: #388e3c;
            border-left: 4px solid #388e3c;
        }
        .loading {
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }
        .info {
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }
        #floorEdgesList {
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .floor-item {
            padding: 8px;
            background-color: white;
            border: 1px solid #ddd;
            margin: 5px 0;
            border-radius: 3px;
            cursor: pointer;
        }
        .floor-item:hover {
            background-color: #e3f2fd;
        }
        .floor-item.highlighted {
            background-color: #ffeb3b;
            border-color: #fbc02d;
            font-weight: bold;
        }
        .instruction {
            background-color: #e3f2fd;
            padding: 10px;
            border-left: 4px solid #1976d2;
            margin: 10px 0;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trimble Connect IFC Viewer - Vloerranden Highlighter</h1>
        
        <div class="instruction">
            <strong>Instructie:</strong> Klik op een vloer/slab element in de 3D viewer, dan detecteren we het type en highlighten we alle vergelijkbare elementen!
        </div>
        
        <div class="controls">
            <button onclick="detectAndHighlight()">🎯 Detecteer & Highlighten</button>
            <button class="secondary" onclick="resetHighlight()">↻ Reset</button>
            <button class="danger" onclick="isolateSelected()">🔍 Isoleer Gedetecteerde</button>
        </div>
        
        <div id="result" class="result">
            <p id="message"></p>
        </div>
        
        <div id="floorEdgesList"></div>
    </div>

    <!-- Trimble Connect Workspace API Script -->
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    
    <script>
        let highlightedFloors = [];
        let detectedType = null;
        
        // Detecteer geselecteerde element en highlighten alle van dat type
        async function detectAndHighlight() {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try {
                resultDiv.classList.add('show');
                messageDiv.className = 'loading';
                messageDiv.textContent = 'Wachten op je selectie... Klik op een element in de 3D viewer!';
                
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {
                        console.log('Event:', event, data);
                    }
                );
                
                // Wacht op selection verandering (max 30 seconden)
                const selectionPromise = waitForSelection(API);
                const timeoutPromise = new Promise((_, reject) => 
                    setTimeout(() => reject(new Error('Timeout - geen element geselecteerd')), 30000)
                );
                
                const selectedIds = await Promise.race([selectionPromise, timeoutPromise]);
                
                if (!selectedIds || selectedIds.length === 0) {
                    messageDiv.className = 'error';
                    messageDiv.textContent = 'Geen element geselecteerd';
                    return;
                }
                
                messageDiv.className = 'loading';
                messageDiv.textContent = `Element geselecteerd (ID: ${selectedIds[0]}). Analyseren...`;
                
                // Nu hebben we een geselecteerd element
                // We gaan aannemen dat dit een slab/vloer is
                // En we highlighten alle objecten van vergelijkbare grootte
                
                const allObjects = await API.viewer.getObjects();
                const allIds = allObjects[0].objects.map(o => o.id);
                
                // Voor nu: highlighten we alle objecten
                // (omdat we de IFC type niet kunnen detecteren)
                highlightedFloors = allIds.map((id, idx) => ({
                    id: id,
                    name: `Element ${id}`
                }));
                
                // Selecteer alle
                await API.viewer.setSelection(allIds);
                
                messageDiv.className = 'success';
                messageDiv.innerHTML = `
                    <strong>✓ Geselecteerde element: ID ${selectedIds[0]}</strong><br>
                    <small>Alle ${allIds.length} elementen zijn geselecteerd. (Opmerking: we kunnen het IFC type nog niet filteren)</small>
                `;
                
                displayFloorList();
                
            } catch (error) {
                resultDiv.classList.add('show');
                messageDiv.className = 'error';
                messageDiv.textContent = `Fout: ${error.message}`;
                console.error('Error:', error);
            }
        }
        
        // Wacht op selection verandering
        async function waitForSelection(API) {
            return new Promise((resolve) => {
                const checkInterval = setInterval(async () => {
                    try {
                        const currentSelection = await API.viewer.getSelection();
                        if (currentSelection && currentSelection.length > 0) {
                            clearInterval(checkInterval);
                            resolve(currentSelection);
                        }
                    } catch (e) {
                        console.log('Checking selection...');
                    }
                }, 500);
            });
        }
        
        // Reset highlight
        async function resetHighlight() {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try {
                resultDiv.classList.add('show');
                messageDiv.className = 'loading';
                messageDiv.textContent = 'Highlight wordt gereset...';
                
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {
                        console.log('Event:', event, data);
                    }
                );
                
                // Clear selection
                await API.viewer.setSelection([]);
                
                highlightedFloors = [];
                detectedType = null;
                document.getElementById('floorEdgesList').innerHTML = '';
                
                messageDiv.className = 'success';
                messageDiv.textContent = '✓ Highlight is gereset';
                
            } catch (error) {
                messageDiv.className = 'error';
                messageDiv.textContent = `Fout bij reset: ${error.message}`;
                console.error('Error:', error);
            }
        }
        
        // Isoleer geselecteerde elementen
        async function isolateSelected() {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try {
                resultDiv.classList.add('show');
                messageDiv.className = 'loading';
                messageDiv.textContent = 'Isoleren...';
                
                if (highlightedFloors.length === 0) {
                    messageDiv.className = 'error';
                    messageDiv.textContent = 'Geen elementen geselecteerd. Klik eerst op "Detecteer & Highlighten"';
                    return;
                }
                
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {
                        console.log('Event:', event, data);
                    }
                );
                
                const ids = highlightedFloors.map(f => f.id);
                await API.viewer.isolateEntities(ids);
                
                messageDiv.className = 'success';
                messageDiv.textContent = `✓ ${ids.length} elementen zijn geïsoleerd`;
                
            } catch (error) {
                messageDiv.className = 'error';
                messageDiv.textContent = `Fout: ${error.message}`;
                console.error('Error:', error);
            }
        }
        
        // Display floor list
        function displayFloorList(slabs = highlightedFloors) {
            const listDiv = document.getElementById('floorEdgesList');
            
            if (!slabs || slabs.length === 0) {
                listDiv.innerHTML = '';
                return;
            }
            
            let html = `<h3>Geselecteerde Elementen (${slabs.length}):</h3>`;
            slabs.slice(0, 20).forEach(item => {
                html += `
                    <div class="floor-item highlighted">
                        <strong>${item.name}</strong>
                        <small>(ID: ${item.id})</small>
                    </div>
                `;
            });
            
            if (slabs.length > 20) {
                html += `<div style="padding: 10px; text-align: center; color: #666;">... en ${slabs.length - 20} meer</div>`;
            }
            
            listDiv.innerHTML = html;
        }
    </script>
</body>
</html>
