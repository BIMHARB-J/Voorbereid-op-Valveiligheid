<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trimble Connect IFC Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0052a3;
        }
        button.secondary {
            background-color: #666;
        }
        button.secondary:hover {
            background-color: #444;
        }
        button.danger {
            background-color: #d32f2f;
        }
        button.danger:hover {
            background-color: #b71c1c;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 3px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .error {
            color: #d32f2f;
            border-left: 4px solid #d32f2f;
        }
        .success {
            color: #388e3c;
            border-left: 4px solid #388e3c;
        }
        .loading {
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }
        #floorEdgesList {
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .floor-item {
            padding: 8px;
            background-color: white;
            border: 1px solid #ddd;
            margin: 5px 0;
            border-radius: 3px;
        }
        .floor-item.highlighted {
            background-color: #ffeb3b;
            border-color: #fbc02d;
            font-weight: bold;
        }
        .instruction {
            background-color: #e3f2fd;
            padding: 10px;
            border-left: 4px solid #1976d2;
            margin: 10px 0;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trimble Connect IFC Viewer - Floor Edges Highlighter</h1>
        
        <div class="instruction">
            <strong>Instructie:</strong> Klik op "Debug PsetDefinitions" om de property structure te zien
        </div>
        
        <div class="controls">
            <button class="secondary" onclick="debugPsetDefinitions()">Debug PsetDefinitions</button>
            <button onclick="highlightSlabsAndRoofs()">Highlighten SLAB & ROOF</button>
            <button class="secondary" onclick="resetHighlight()">↻ Reset</button>
            <button class="danger" onclick="isolateSelected()">Isoleer</button>
        </div>
        
        <div id="result" class="result">
            <p id="message"></p>
        </div>
        
        <div id="floorEdgesList"></div>
    </div>

    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    
    <script>
        let highlightedFloors = [];
        
        // Debug PsetDefinitions
        async function debugPsetDefinitions() {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try {
                resultDiv.classList.add('show');
                messageDiv.className = 'loading';
                messageDiv.textContent = 'PsetDefinitions analyseren...';
                
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {}
                );
                
                const psetDefs = await API.viewer.getPsetDefinitions();
                console.log('=== PSET DEFINITIONS ===');
                console.log('Count:', psetDefs.length);
                console.log('Full data:', JSON.stringify(psetDefs, null, 2));
                
                psetDefs.forEach((pset, idx) => {
                    console.log(`\n--- PsetDefinition ${idx} ---`);
                    console.log('Keys:', Object.keys(pset));
                    for (const [key, value] of Object.entries(pset)) {
                        console.log(`${key}:`, value);
                    }
                });
                
                messageDiv.className = 'success';
                messageDiv.textContent = '✓ PsetDefinitions gelogd in console (F12)';
                
            } catch (error) {
                messageDiv.className = 'error';
                messageDiv.textContent = `Error: ${error.message}`;
                console.error('Error:', error);
            }
        }
        
        // Highlighten SLAB en ROOF
        async function highlightSlabsAndRoofs() {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try {
                resultDiv.classList.add('show');
                messageDiv.className = 'loading';
                messageDiv.textContent = 'Stap 1: PsetDefinitions ophalen...';
                
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {}
                );
                
                // Haal PsetDefinitions op
                const psetDefs = await API.viewer.getPsetDefinitions();
                console.log('PsetDefinitions:', psetDefs);
                
                if (!psetDefs || psetDefs.length === 0) {
                    messageDiv.className = 'error';
                    messageDiv.textContent = 'Geen PsetDefinitions gevonden';
                    return;
                }
                
                // Zoek naar Common Type property
                const commonTypeDef = psetDefs.find(p => {
                    const str = JSON.stringify(p).toLowerCase();
                    return str.includes('common type') || str.includes('commontype');
                });
                
                console.log('Common Type Pset:', commonTypeDef);
                
                messageDiv.textContent = 'Stap 2: Alle objecten ophalen...';
                
                const allObjects = await API.viewer.getObjects();
                const allIds = allObjects[0].objects.map(o => o.id);
                
                console.log('Total objects:', allIds.length);
                
                messageDiv.textContent = 'Stap 3: SLAB/ROOF elementen scannen...';
                
                const slabsAndRoofs = [];
                
                // Scan alle elementen
                for (let i = 0; i < allIds.length; i++) {
                    try {
                        // Selecteer element om properties te laden
                        await API.viewer.setSelection([allIds[i]]);
                        
                        // Probeer properties via showModelDetails (dit laadt de properties panel)
                        await API.viewer.showModelDetails([allIds[i]]);
                        
                        // Haal nu properties op
                        const props = await API.viewer.getObjectProperties(allIds[i]);
                        
                        if (props && props.length > 0) {
                            // Zoek naar SLAB of ROOF
                            const isSlabOrRoof = props.some(p => 
                                p.value === 'SLAB' || p.value === 'ROOF'
                            );
                            
                            if (isSlabOrRoof) {
                                const typeProp = props.find(p => p.value === 'SLAB' || p.value === 'ROOF');
                                slabsAndRoofs.push({
                                    id: allIds[i],
                                    name: `${typeProp.value} ${allIds[i]}`,
                                    type: typeProp.value
                                });
                                
                                if (slabsAndRoofs.length % 10 === 0) {
                                    console.log(`Found ${slabsAndRoofs.length} SLAB/ROOF elements`);
                                }
                            }
                        }
                    } catch (e) {
                        // Silent fail
                    }
                    
                    if ((i + 1) % 500 === 0) {
                        messageDiv.textContent = `Gecheckt ${i + 1}/${allIds.length} elementen... (${slabsAndRoofs.length} gevonden)`;
                    }
                }
                
                console.log('Found SLAB/ROOF:', slabsAndRoofs);
                
                if (slabsAndRoofs.length === 0) {
                    messageDiv.className = 'error';
                    messageDiv.textContent = 'Geen SLAB/ROOF elementen gevonden';
                    return;
                }
                
                messageDiv.textContent = `Stap 4: ${slabsAndRoofs.length} elementen selecteren...`;
                
                const selectedIds = slabsAndRoofs.map(s => s.id);
                await API.viewer.setSelection(selectedIds);
                
                highlightedFloors = slabsAndRoofs;
                
                messageDiv.className = 'success';
                messageDiv.innerHTML = `
                    <strong>✓ ${slabsAndRoofs.length} SLAB/ROOF elementen gemarkeerd!</strong><br>
                    <small>${slabsAndRoofs.filter(s => s.type === 'SLAB').length} Slabs | 
                    ${slabsAndRoofs.filter(s => s.type === 'ROOF').length} Roofs</small>
                `;
                
                displayFloorList();
                
            } catch (error) {
                resultDiv.classList.add('show');
                messageDiv.className = 'error';
                messageDiv.textContent = `Error: ${error.message}`;
                console.error('Error:', error);
            }
        }
        
        // Reset
        async function resetHighlight() {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try {
                resultDiv.classList.add('show');
                messageDiv.className = 'loading';
                messageDiv.textContent = 'Resetten...';
                
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {}
                );
                
                await API.viewer.setSelection([]);
                highlightedFloors = [];
                document.getElementById('floorEdgesList').innerHTML = '';
                
                messageDiv.className = 'success';
                messageDiv.textContent = '✓ Reset';
                
            } catch (error) {
                messageDiv.className = 'error';
                messageDiv.textContent = `Error: ${error.message}`;
            }
        }
        
        // Isoleer
        async function isolateSelected() {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try {
                resultDiv.classList.add('show');
                messageDiv.className = 'loading';
                messageDiv.textContent = 'Isoleren...';
                
                if (highlightedFloors.length === 0) {
                    messageDiv.className = 'error';
                    messageDiv.textContent = 'Geen elementen gemarkeerd';
                    return;
                }
                
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {}
                );
                
                const ids = highlightedFloors.map(f => f.id);
                await API.viewer.isolateEntities(ids);
                
                messageDiv.className = 'success';
                messageDiv.textContent = `✓ ${ids.length} elementen geïsoleerd`;
                
            } catch (error) {
                messageDiv.className = 'error';
                messageDiv.textContent = `Error: ${error.message}`;
            }
        }
        
        function displayFloorList(slabs = highlightedFloors) {
            const listDiv = document.getElementById('floorEdgesList');
            
            if (!slabs || slabs.length === 0) {
                listDiv.innerHTML = '';
                return;
            }
            
            let html = `<h3>Gemarkeerde (${slabs.length}):</h3>`;
            slabs.slice(0, 30).forEach(item => {
                html += `<div class="floor-item highlighted"><strong>${item.name}</strong></div>`;
            });
            
            if (slabs.length > 30) {
                html += `<div style="padding: 10px; text-align: center;">... en ${slabs.length - 30} meer</div>`;
            }
            
            listDiv.innerHTML = html;
        }
    </script>
</body>
</html>
