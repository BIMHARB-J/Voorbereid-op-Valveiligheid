<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trimble Connect IFC Viewer - Floor Edges Highlighter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0052a3;
        }
        button.secondary {
            background-color: #666;
        }
        button.secondary:hover {
            background-color: #444;
        }
        button.danger {
            background-color: #d32f2f;
        }
        button.danger:hover {
            background-color: #b71c1c;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 3px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .error {
            color: #d32f2f;
            border-left: 4px solid #d32f2f;
        }
        .success {
            color: #388e3c;
            border-left: 4px solid #388e3c;
        }
        .loading {
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }
        .info {
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }
        #floorEdgesList {
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .floor-item {
            padding: 8px;
            background-color: white;
            border: 1px solid #ddd;
            margin: 5px 0;
            border-radius: 3px;
        }
        .floor-item.highlighted {
            background-color: #ffeb3b;
            border-color: #fbc02d;
            font-weight: bold;
        }
        .instruction {
            background-color: #e3f2fd;
            padding: 10px;
            border-left: 4px solid #1976d2;
            margin: 10px 0;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trimble Connect IFC Viewer - Vloerranden Highlighter</h1>
        
        <div class="instruction">
            <strong>Instructie:</strong> Klik op "Debug Mode" eerst om de property structuur te zien, dan "Highlighten SLAB & ROOF"!
        </div>
        
        <div class="controls">
            <button class="secondary" onclick="debugProperties()">🔍 Debug Mode - Zie Properties</button>
            <button onclick="highlightSlabsAndRoofs()">🎯 Highlighten SLAB & ROOF</button>
            <button class="secondary" onclick="resetHighlight()">↻ Reset</button>
            <button class="danger" onclick="isolateSelected()">🔍 Isoleer Gemarkeerde</button>
        </div>
        
        <div id="result" class="result">
            <p id="message"></p>
        </div>
        
        <div id="floorEdgesList"></div>
    </div>

    <!-- Trimble Connect Workspace API Script -->
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    
    <script>
        let highlightedFloors = [];
        
        // Debug: zie wat getPsetDefinitions geeft
        async function debugProperties() {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try {
                resultDiv.classList.add('show');
                messageDiv.className = 'loading';
                messageDiv.textContent = 'Debug mode: Properties ophalen...';
                
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {
                        console.log('Event:', event, data);
                    }
                );
                
                // Haal alle objecten op
                const allObjects = await API.viewer.getObjects();
                const allIds = allObjects[0].objects.map(o => o.id);
                
                console.log('=== DEBUG MODE ===');
                console.log('Total objects:', allIds.length);
                
                // Probeer getPsetDefinitions
                console.log('Trying getPsetDefinitions...');
                const psetDefs = await API.viewer.getPsetDefinitions();
                console.log('PsetDefinitions:', psetDefs);
                
                // Try first few objects
                for (let i = 0; i < Math.min(3, allIds.length); i++) {
                    console.log(`\n=== Object ${i} (ID: ${allIds[i]}) ===`);
                    
                    // Try different API calls
                    try {
                        const props = await API.viewer.getObjectProperties(allIds[i]);
                        console.log('getObjectProperties:', props);
                    } catch (e) {
                        console.log('getObjectProperties error:', e.message);
                    }
                    
                    // Try getHierarchyParents
                    try {
                        const parents = await API.viewer.getHierarchyParents([allIds[i]]);
                        console.log('getHierarchyParents:', parents);
                    } catch (e) {
                        console.log('getHierarchyParents error:', e.message);
                    }
                    
                    // Try getHierarchyChildren
                    try {
                        const children = await API.viewer.getHierarchyChildren([allIds[i]]);
                        console.log('getHierarchyChildren:', children);
                    } catch (e) {
                        console.log('getHierarchyChildren error:', e.message);
                    }
                }
                
                messageDiv.className = 'success';
                messageDiv.textContent = 'Debug info gelogd in console (F12)';
                
            } catch (error) {
                messageDiv.className = 'error';
                messageDiv.textContent = `Error: ${error.message}`;
                console.error('Error:', error);
            }
        }
        
        // Highlighten SLAB en ROOF elementen
        async function highlightSlabsAndRoofs() {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try {
                resultDiv.classList.add('show');
                messageDiv.className = 'loading';
                messageDiv.textContent = 'SLAB en ROOF elementen zoeken...';
                console.log('=== START highlightSlabsAndRoofs ===');
                
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {
                        console.log('Event:', event, data);
                    }
                );
                
                // Haal alle objecten op
                const allObjects = await API.viewer.getObjects();
                const allIds = allObjects[0].objects.map(o => o.id);
                
                console.log('Total objects:', allIds.length);
                
                // Try via hierarchy (parent-child relationships)
                messageDiv.textContent = 'Elementen indelen via hierarchy...';
                
                const slabsAndRoofs = [];
                
                for (let i = 0; i < Math.min(200, allIds.length); i++) {
                    try {
                        const parents = await API.viewer.getHierarchyParents([allIds[i]]);
                        
                        if (parents && parents.length > 0) {
                            // Check parent names for SLAB/ROOF
                            const parentInfo = JSON.stringify(parents).toUpperCase();
                            
                            if (parentInfo.includes('SLAB') || parentInfo.includes('ROOF')) {
                                slabsAndRoofs.push({
                                    id: allIds[i],
                                    name: `Element ${allIds[i]}`,
                                    type: parentInfo.includes('SLAB') ? 'SLAB' : 'ROOF'
                                });
                                console.log(`✓ Found ${parentInfo.includes('SLAB') ? 'SLAB' : 'ROOF'}`);
                            }
                        }
                    } catch (e) {
                        // Silent
                    }
                    
                    if ((i + 1) % 50 === 0) {
                        messageDiv.textContent = `Gecheckt ${i + 1}/200 elementen...`;
                    }
                }
                
                console.log('Found via hierarchy:', slabsAndRoofs);
                
                if (slabsAndRoofs.length === 0) {
                    messageDiv.className = 'error';
                    messageDiv.innerHTML = `
                        <strong>Geen SLAB/ROOF gevonden via hierarchy</strong><br>
                        <small>Probeer Debug Mode knop eerst om te zien hoe properties gestructureerd zijn</small>
                    `;
                    return;
                }
                
                messageDiv.textContent = `${slabsAndRoofs.length} elementen gevonden, highlighten...`;
                
                // Selecteer alle
                const selectedIds = slabsAndRoofs.map(s => s.id);
                await API.viewer.setSelection(selectedIds);
                
                highlightedFloors = slabsAndRoofs;
                
                messageDiv.className = 'success';
                messageDiv.innerHTML = `
                    <strong>✓ ${slabsAndRoofs.length} elementen gemarkeerd!</strong>
                `;
                
                displayFloorList();
                
            } catch (error) {
                resultDiv.classList.add('show');
                messageDiv.className = 'error';
                messageDiv.textContent = `Error: ${error.message}`;
                console.error('Error:', error);
            }
        }
        
        // Reset highlight
        async function resetHighlight() {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try {
                resultDiv.classList.add('show');
                messageDiv.className = 'loading';
                messageDiv.textContent = 'Highlight wordt gereset...';
                
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {}
                );
                
                await API.viewer.setSelection([]);
                highlightedFloors = [];
                document.getElementById('floorEdgesList').innerHTML = '';
                
                messageDiv.className = 'success';
                messageDiv.textContent = '✓ Highlight is gereset';
                
            } catch (error) {
                messageDiv.className = 'error';
                messageDiv.textContent = `Error: ${error.message}`;
            }
        }
        
        // Isoleer geselecteerde elementen
        async function isolateSelected() {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try {
                resultDiv.classList.add('show');
                messageDiv.className = 'loading';
                messageDiv.textContent = 'Isoleren...';
                
                if (highlightedFloors.length === 0) {
                    messageDiv.className = 'error';
                    messageDiv.textContent = 'Geen elementen gemarkeerd';
                    return;
                }
                
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {}
                );
                
                const ids = highlightedFloors.map(f => f.id);
                await API.viewer.isolateEntities(ids);
                
                messageDiv.className = 'success';
                messageDiv.textContent = `✓ ${ids.length} elementen geïsoleerd`;
                
            } catch (error) {
                messageDiv.className = 'error';
                messageDiv.textContent = `Error: ${error.message}`;
            }
        }
        
        // Display floor list
        function displayFloorList(slabs = highlightedFloors) {
            const listDiv = document.getElementById('floorEdgesList');
            
            if (!slabs || slabs.length === 0) {
                listDiv.innerHTML = '';
                return;
            }
            
            let html = `<h3>Gemarkeerde Elementen (${slabs.length}):</h3>`;
            slabs.slice(0, 30).forEach(item => {
                html += `
                    <div class="floor-item highlighted">
                        <strong>${item.name}</strong>
                    </div>
                `;
            });
            
            if (slabs.length > 30) {
                html += `<div style="padding: 10px; text-align: center;">... en ${slabs.length - 30} meer</div>`;
            }
            
            listDiv.innerHTML = html;
        }
    </script>
</body>
</html>
