<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trimble Connect IFC Viewer - Debug</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        #debug {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 20px;
            border-radius: 3px;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trimble Connect API Debug</h1>
        <button onclick="debugAPI()"> Toon Beschikbare API Methodes</button>
        <button onclick="getModelInfo()"> Toon Model Informatie</button>
        
        <div id="debug"></div>
    </div>

    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    
    <script>
        let API = null;
        
        async function initAPI() {
            try {
                API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {
                        console.log('Event:', event, data);
                        addDebug(`Event: ${event}`, data);
                    }
                );
                addDebug('✓ API verbonden');
            } catch (error) {
                addDebug('✗ API fout:', error.message);
            }
        }
        
        function debugAPI() {
            if (!API) {
                addDebug('API is niet geïnitialiseerd');
                return;
            }
            
            addDebug('=== BESCHIKBARE API METHODES ===\n');
            
            // Check alle beschikbare properties
            const apiKeys = Object.keys(API);
            addDebug(`Hoofd-objecten: ${apiKeys.join(', ')}\n`);
            
            // Check elk object dieper
            apiKeys.forEach(key => {
                const obj = API[key];
                if (obj && typeof obj === 'object') {
                    const methods = Object.keys(obj);
                    addDebug(`\n${key}:`, methods.join(', '));
                }
            });
        }
        
        async function getModelInfo() {
            if (!API) {
                addDebug('API is niet geïnitialiseerd');
                return;
            }
            
            addDebug('=== MODEL INFORMATIE ===\n');
            
            try {
                // Probeer project info
                if (API.project && typeof API.project.getProject === 'function') {
                    const project = await API.project.getProject();
                    addDebug('Project:', JSON.stringify(project, null, 2));
                }
                
                // Probeer andere methodes
                if (API.view) {
                    addDebug('\nView methodes beschikbaar:', Object.keys(API.view).join(', '));
                }
                
                if (API.selection) {
                    addDebug('\nSelection methodes beschikbaar:', Object.keys(API.selection).join(', '));
                }
                
                if (API.3d) {
                    addDebug('\n3D methodes beschikbaar:', Object.keys(API['3d']).join(', '));
                }
                
            } catch (error) {
                addDebug('Fout:', error.message);
            }
        }
        
        function addDebug(title, content = '') {
            const debugDiv = document.getElementById('debug');
            let text = title;
            if (content) {
                if (typeof content === 'string') {
                    text += '\n' + content;
                } else {
                    text += '\n' + JSON.stringify(content, null, 2);
                }
            }
            debugDiv.textContent += text + '\n\n';
            debugDiv.scrollTop = debugDiv.scrollHeight;
        }
        
        window.addEventListener('load', initAPI);
    </script>
</body>
</html>
