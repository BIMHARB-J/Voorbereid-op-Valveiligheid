<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trimble Connect IFC Viewer - Floor Edges Highlighter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0052a3;
        }
        button.secondary {
            background-color: #666;
        }
        button.secondary:hover {
            background-color: #444;
        }
        button.danger {
            background-color: #d32f2f;
        }
        button.danger:hover {
            background-color: #b71c1c;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 3px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .error {
            color: #d32f2f;
            border-left: 4px solid #d32f2f;
        }
        .success {
            color: #388e3c;
            border-left: 4px solid #388e3c;
        }
        .loading {
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }
        #floorEdgesList {
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .floor-item {
            padding: 8px;
            background-color: white;
            border: 1px solid #ddd;
            margin: 5px 0;
            border-radius: 3px;
        }
        .floor-item.highlighted {
            background-color: #ffeb3b;
            border-color: #fbc02d;
            font-weight: bold;
        }
        .instruction {
            background-color: #e3f2fd;
            padding: 10px;
            border-left: 4px solid #1976d2;
            margin: 10px 0;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trimble Connect IFC Viewer - Floor Edges Highlighter</h1>
        
        <div class="instruction">
            <strong>Instructie:</strong> Klik op "Highlighten SLAB & ROOF" om alle vloerranden te markeren!
        </div>
        
        <div class="controls">
            <button class="secondary" onclick="debugObjectStructure()">🔍 Debug Object Structure</button>
            <button onclick="highlightSlabsAndRoofs()">🎯 Highlighten SLAB & ROOF</button>
            <button class="secondary" onclick="resetHighlight()">↻ Reset</button>
            <button class="danger" onclick="isolateSelected()">🔍 Isoleer</button>
        </div>
        
        <div id="result" class="result">
            <p id="message"></p>
        </div>
        
        <div id="floorEdgesList"></div>
    </div>

    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    
    <script>
        let highlightedFloors = [];
        
        // Debug object structure
        async function debugObjectStructure() {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try {
                resultDiv.classList.add('show');
                messageDiv.className = 'loading';
                messageDiv.textContent = 'Object structure analyseren...';
                
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {}
                );
                
                const allObjects = await API.viewer.getObjects();
                console.log('=== OBJECT STRUCTURE ===');
                console.log('Top level:', allObjects);
                console.log('Objects array:', allObjects[0].objects.slice(0, 3));
                
                // Log first object in detail
                const firstObj = allObjects[0].objects[0];
                console.log('\n=== First Object Detail ===');
                console.log('Full object:', JSON.stringify(firstObj, null, 2));
                
                messageDiv.className = 'success';
                messageDiv.textContent = '✓ Object structure gelogd (F12)';
                
            } catch (error) {
                messageDiv.className = 'error';
                messageDiv.textContent = `Error: ${error.message}`;
                console.error('Error:', error);
            }
        }
        
        // Highlighten SLAB en ROOF
        async function highlightSlabsAndRoofs() {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try {
                resultDiv.classList.add('show');
                messageDiv.className = 'loading';
                messageDiv.textContent = 'SLAB en ROOF elementen zoeken...';
                
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {}
                );
                
                // Haal alle objecten op
                const allObjects = await API.viewer.getObjects();
                const objects = allObjects[0].objects;
                
                console.log('Total objects:', objects.length);
                
                const slabsAndRoofs = [];
                
                // Scan alle objecten
                messageDiv.textContent = 'Scanning 0/0 elementen...';
                
                for (let i = 0; i < objects.length; i++) {
                    const obj = objects[i];
                    
                    // Check of object properties heeft
                    if (obj.properties && Array.isArray(obj.properties)) {
                        // Zoek naar "Common Type" property met waarde SLAB of ROOF
                        const commonTypeProp = obj.properties.find(pset => {
                            if (pset.properties && Array.isArray(pset.properties)) {
                                const commonType = pset.properties.find(prop => 
                                    prop.name === 'Common Type' || 
                                    prop.name === 'CommonType'
                                );
                                if (commonType) {
                                    return commonType.value === 'SLAB' || commonType.value === 'ROOF';
                                }
                            }
                            return false;
                        });
                        
                        if (commonTypeProp) {
                            // Find the actual type value
                            const typeValue = commonTypeProp.properties.find(p => 
                                p.name === 'Common Type' || p.name === 'CommonType'
                            )?.value;
                            
                            slabsAndRoofs.push({
                                id: obj.id,
                                name: obj.product?.name || `${typeValue} ${obj.id}`,
                                type: typeValue,
                                class: obj.class
                            });
                            
                            console.log(`✓ Found ${typeValue}: ${obj.product?.name || obj.id}`);
                        }
                    }
                    
                    if ((i + 1) % 500 === 0) {
                        messageDiv.textContent = `Scanning ${i + 1}/${objects.length} elementen... (${slabsAndRoofs.length} gevonden)`;
                    }
                }
                
                console.log('Found SLAB/ROOF:', slabsAndRoofs);
                
                if (slabsAndRoofs.length === 0) {
                    messageDiv.className = 'error';
                    messageDiv.innerHTML = `
                        <strong>Geen SLAB/ROOF elementen gevonden</strong><br>
                        <small>Klik Debug voor meer info</small>
                    `;
                    return;
                }
                
                messageDiv.textContent = `${slabsAndRoofs.length} elementen gevonden, selecteren...`;
                
                // Selecteer alle
                const selectedIds = slabsAndRoofs.map(s => s.id);
                await API.viewer.setSelection(selectedIds);
                
                highlightedFloors = slabsAndRoofs;
                
                messageDiv.className = 'success';
                messageDiv.innerHTML = `
                    <strong>✓ ${slabsAndRoofs.length} SLAB/ROOF elementen gemarkeerd!</strong><br>
                    <small>${slabsAndRoofs.filter(s => s.type === 'SLAB').length} Slabs | 
                    ${slabsAndRoofs.filter(s => s.type === 'ROOF').length} Roofs</small>
                `;
                
                displayFloorList();
                
            } catch (error) {
                resultDiv.classList.add('show');
                messageDiv.className = 'error';
                messageDiv.textContent = `Error: ${error.message}`;
                console.error('Error:', error);
            }
        }
        
        // Reset
        async function resetHighlight() {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try {
                resultDiv.classList.add('show');
                messageDiv.className = 'loading';
                messageDiv.textContent = 'Resetten...';
                
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {}
                );
                
                await API.viewer.setSelection([]);
                highlightedFloors = [];
                document.getElementById('floorEdgesList').innerHTML = '';
                
                messageDiv.className = 'success';
                messageDiv.textContent = '✓ Reset';
                
            } catch (error) {
                messageDiv.className = 'error';
                messageDiv.textContent = `Error: ${error.message}`;
            }
        }
        
        // Isoleer
        async function isolateSelected() {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try {
                resultDiv.classList.add('show');
                messageDiv.className = 'loading';
                messageDiv.textContent = 'Isoleren...';
                
                if (highlightedFloors.length === 0) {
                    messageDiv.className = 'error';
                    messageDiv.textContent = 'Geen elementen gemarkeerd';
                    return;
                }
                
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {}
                );
                
                const ids = highlightedFloors.map(f => f.id);
                await API.viewer.isolateEntities(ids);
                
                messageDiv.className = 'success';
                messageDiv.textContent = `✓ ${ids.length} elementen geïsoleerd`;
                
            } catch (error) {
                messageDiv.className = 'error';
                messageDiv.textContent = `Error: ${error.message}`;
            }
        }
        
        function displayFloorList(slabs = highlightedFloors) {
            const listDiv = document.getElementById('floorEdgesList');
            
            if (!slabs || slabs.length === 0) {
                listDiv.innerHTML = '';
                return;
            }
            
            let html = `<h3>Gemarkeerde (${slabs.length}):</h3>`;
            slabs.slice(0, 50).forEach(item => {
                html += `
                    <div class="floor-item highlighted">
                        <strong>${item.name}</strong>
                        <small>${item.type}</small>
                    </div>
                `;
            });
            
            if (slabs.length > 50) {
                html += `<div style="padding: 10px;">... en ${slabs.length - 50} meer</div>`;
            }
            
            listDiv.innerHTML = html;
        }
    </script>
</body>
</html>
