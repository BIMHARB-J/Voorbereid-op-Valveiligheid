<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trimble Connect IFC Viewer - Floor Edges Highlighter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0052a3;
        }
        button.secondary {
            background-color: #666;
        }
        button.secondary:hover {
            background-color: #444;
        }
        button.danger {
            background-color: #d32f2f;
        }
        button.danger:hover {
            background-color: #b71c1c;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 3px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .error {
            color: #d32f2f;
            border-left: 4px solid #d32f2f;
        }
        .success {
            color: #388e3c;
            border-left: 4px solid #388e3c;
        }
        .loading {
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }
        .info {
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }
        #floorEdgesList {
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .floor-item {
            padding: 8px;
            background-color: white;
            border: 1px solid #ddd;
            margin: 5px 0;
            border-radius: 3px;
        }
        .floor-item.highlighted {
            background-color: #ffeb3b;
            border-color: #fbc02d;
            font-weight: bold;
        }
        .instruction {
            background-color: #e3f2fd;
            padding: 10px;
            border-left: 4px solid #1976d2;
            margin: 10px 0;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trimble Connect IFC Viewer - Vloerranden Highlighter</h1>
        
        <div class="instruction">
            <strong>Instructie:</strong> Klik op "Highlighten SLAB & ROOF" om alle vloer- en dakelementen snel te markeren via DataTable!
        </div>
        
        <div class="controls">
            <button onclick="highlightSlabsAndRoofs()">🎯 Highlighten SLAB & ROOF</button>
            <button class="secondary" onclick="resetHighlight()">↻ Reset</button>
            <button class="danger" onclick="isolateSelected()">🔍 Isoleer Gemarkeerde</button>
        </div>
        
        <div id="result" class="result">
            <p id="message"></p>
        </div>
        
        <div id="floorEdgesList"></div>
    </div>

    <!-- Trimble Connect Workspace API Script -->
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    
    <script>
        let highlightedFloors = [];
        
        // Highlighten SLAB en ROOF elementen via DataTable
        async function highlightSlabsAndRoofs() {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try {
                resultDiv.classList.add('show');
                messageDiv.className = 'loading';
                messageDiv.textContent = 'SLAB en ROOF elementen zoeken via DataTable...';
                
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {
                        console.log('Event:', event, data);
                    }
                );
                
                // Get DataTable config
                const config = await API.dataTable.getConfig();
                console.log('DataTable config:', config);
                
                messageDiv.textContent = 'Alle columns ophalen...';
                
                // Haal alle columns op
                const allColumns = await API.dataTable.getAllColumns();
                console.log('Alle columns:', allColumns);
                
                // Zoek naar Common Type column
                const commonTypeColumn = allColumns.find(col => 
                    col.name.toLowerCase().includes('common type') ||
                    col.name.toLowerCase().includes('commontype') ||
                    col.name === 'Common Type'
                );
                
                if (!commonTypeColumn) {
                    messageDiv.className = 'error';
                    messageDiv.textContent = 'Common Type column niet gevonden in DataTable';
                    console.log('Beschikbare columns:', allColumns.map(c => c.name).join(', '));
                    return;
                }
                
                messageDiv.textContent = `Common Type column gevonden: ${commonTypeColumn.name}. Filteren...`;
                
                // Maak filter config
                const newConfig = {
                    ...config,
                    filters: [
                        {
                            column: commonTypeColumn.id || commonTypeColumn.name,
                            operator: 'in',
                            value: ['SLAB', 'ROOF']
                        }
                    ]
                };
                
                // Apply filter
                await API.dataTable.setConfig(newConfig);
                
                messageDiv.textContent = 'Gefilterde elementen ophalen...';
                
                // Haal alle objecten op (nu gefilterd)
                const allObjects = await API.viewer.getObjects();
                const filteredIds = allObjects[0].objects.map(o => o.id);
                
                if (filteredIds.length === 0) {
                    messageDiv.className = 'error';
                    messageDiv.textContent = 'Geen SLAB of ROOF elementen gevonden na filteren';
                    return;
                }
                
                messageDiv.textContent = `${filteredIds.length} elementen gevonden, highlighten...`;
                
                // Selecteer alle gefilterde elementen
                await API.viewer.setSelection(filteredIds);
                
                // Maak list van gevonden elementen
                highlightedFloors = filteredIds.map((id, idx) => ({
                    id: id,
                    name: `Element ${id}`
                }));
                
                messageDiv.className = 'success';
                messageDiv.innerHTML = `
                    <strong>✓ ${filteredIds.length} SLAB/ROOF elementen gemarkeerd!</strong><br>
                    <small>Gefilterd via DataTable API (veel sneller)</small>
                `;
                
                displayFloorList();
                
            } catch (error) {
                resultDiv.classList.add('show');
                messageDiv.className = 'error';
                messageDiv.textContent = `Fout: ${error.message}`;
                console.error('Error:', error);
            }
        }
        
        // Reset highlight
        async function resetHighlight() {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try {
                resultDiv.classList.add('show');
                messageDiv.className = 'loading';
                messageDiv.textContent = 'Highlight en filter worden gereset...';
                
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {
                        console.log('Event:', event, data);
                    }
                );
                
                // Clear selection
                await API.viewer.setSelection([]);
                
                // Reset filter
                const config = await API.dataTable.getConfig();
                config.filters = [];
                await API.dataTable.setConfig(config);
                
                highlightedFloors = [];
                document.getElementById('floorEdgesList').innerHTML = '';
                
                messageDiv.className = 'success';
                messageDiv.textContent = '✓ Highlight en filter zijn gereset';
                
            } catch (error) {
                messageDiv.className = 'error';
                messageDiv.textContent = `Fout bij reset: ${error.message}`;
                console.error('Error:', error);
            }
        }

            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try
