<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trimble Connect IFC Viewer - Floor Edges Highlighter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0052a3;
        }
        button.secondary {
            background-color: #666;
        }
        button.secondary:hover {
            background-color: #444;
        }
        button.danger {
            background-color: #d32f2f;
        }
        button.danger:hover {
            background-color: #b71c1c;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 3px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .error {
            color: #d32f2f;
            border-left: 4px solid #d32f2f;
        }
        .success {
            color: #388e3c;
            border-left: 4px solid #388e3c;
        }
        .loading {
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }
        .info {
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }
        #floorEdgesList {
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .floor-item {
            padding: 8px;
            background-color: white;
            border: 1px solid #ddd;
            margin: 5px 0;
            border-radius: 3px;
        }
        .floor-item.highlighted {
            background-color: #ffeb3b;
            border-color: #fbc02d;
            font-weight: bold;
        }
        .instruction {
            background-color: #e3f2fd;
            padding: 10px;
            border-left: 4px solid #1976d2;
            margin: 10px 0;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trimble Connect IFC Viewer - Vloerranden Highlighter</h1>
        
        <div class="instruction">
            <strong>Instructie:</strong> Klik op "Highlighten SLAB & ROOF" om alle vloer- en dakelementen snel te markeren!
        </div>
        
        <div class="controls">
            <button onclick="highlightSlabsAndRoofs()">Highlighten SLAB & ROOF</button>
            <button class="secondary" onclick="resetHighlight()">↻ Reset</button>
            <button class="danger" onclick="isolateSelected()">Isoleer Gemarkeerde</button>
        </div>
        
        <div id="result" class="result">
            <p id="message"></p>
        </div>
        
        <div id="floorEdgesList"></div>
    </div>

    <!-- Trimble Connect Workspace API Script -->
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    
    <script>
        let highlightedFloors = [];
        
        // Highlighten SLAB en ROOF elementen
        async function highlightSlabsAndRoofs() {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try {
                resultDiv.classList.add('show');
                messageDiv.className = 'loading';
                messageDiv.textContent = 'SLAB en ROOF elementen zoeken via properties...';
                console.log('=== START highlightSlabsAndRoofs ===');
                
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {
                        console.log('Event:', event, data);
                    }
                );
                
                console.log('API verbonden');
                
                // Haal alle objecten op
                messageDiv.textContent = 'Alle elementen ophalen...';
                const allObjects = await API.viewer.getObjects();
                const allIds = allObjects[0].objects.map(o => o.id);
                
                console.log('Total objects:', allIds.length);
                
                const slabsAndRoofs = [];
                const sampleSize = Math.min(50, allIds.length);
                
                // Check first objects to find properties and SLAB/ROOF
                messageDiv.textContent = 'Eigenschappen van elementen ophalen...';
                
                for (let i = 0; i < sampleSize; i++) {
                    try {
                        const props = await API.viewer.getObjectProperties(allIds[i]);
                        
                        if (props && props.length > 0) {
                            console.log(`Object ${i} (ID: ${allIds[i]}):`, props);
                            
                            // Zoek naar Common Type property
                            const commonTypeProp = props.find(p => 
                                p.name && (p.name.toLowerCase().includes('common type') || 
                                          p.name.toLowerCase().includes('type') ||
                                          p.value === 'SLAB' || 
                                          p.value === 'ROOF')
                            );
                            
                            if (commonTypeProp && (commonTypeProp.value === 'SLAB' || commonTypeProp.value === 'ROOF')) {
                                slabsAndRoofs.push({
                                    id: allIds[i],
                                    name: `${commonTypeProp.value} (ID: ${allIds[i]})`,
                                    type: commonTypeProp.value
                                });
                                console.log(`✓ Found ${commonTypeProp.value} at index ${i}`);
                            }
                        }
                    } catch (e) {
                        console.warn(`Error checking object ${i}:`, e.message);
                    }
                    
                    if ((i + 1) % 10 === 0) {
                        messageDiv.textContent = `Gecheckt ${i + 1}/${sampleSize} elementen...`;
                    }
                }
                
                console.log('Found SLAB/ROOF:', slabsAndRoofs);
                
                if (slabsAndRoofs.length === 0) {
                    messageDiv.className = 'error';
                    messageDiv.innerHTML = `
                        <strong>Geen SLAB of ROOF elementen gevonden</strong><br>
                        <small>Mogelijk zijn de properties anders gestructureerd. Check console voor eerste element properties.</small>
                    `;
                    
                    // Debug: log first element properties
                    try {
                        const firstProps = await API.viewer.getObjectProperties(allIds[0]);
                        console.log('First element all properties:', firstProps);
                        if (firstProps && firstProps.length > 0) {
                            console.log('Property names:', firstProps.map(p => `${p.name}=${p.value}`).join(', '));
                        }
                    } catch (e) {
                        console.log('Could not get first element props');
                    }
                    return;
                }
                
                messageDiv.textContent = `${slabsAndRoofs.length} elementen gevonden, highlighten...`;
                
                // Selecteer alle slabs en roofs
                const selectedIds = slabsAndRoofs.map(s => s.id);
                await API.viewer.setSelection(selectedIds);
                
                highlightedFloors = slabsAndRoofs;
                
                messageDiv.className = 'success';
                messageDiv.innerHTML = `
                    <strong>✓ ${slabsAndRoofs.length} SLAB/ROOF elementen gemarkeerd!</strong><br>
                    <small>${slabsAndRoofs.filter(s => s.type === 'SLAB').length} Slabs | 
                    ${slabsAndRoofs.filter(s => s.type === 'ROOF').length} Roofs</small>
                `;
                
                displayFloorList();
                console.log('=== COMPLETE ===');
                
            } catch (error) {
                resultDiv.classList.add('show');
                messageDiv.className = 'error';
                messageDiv.innerHTML = `
                    <strong>Fout:</strong> ${error.message}<br>
                    <small>Check de browser console voor meer details</small>
                `;
                console.error('FULL ERROR:', error);
                console.error('Stack:', error.stack);
            }
        }
        
        // Reset highlight
        async function resetHighlight() {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try {
                resultDiv.classList.add('show');
                messageDiv.className = 'loading';
                messageDiv.textContent = 'Highlight wordt gereset...';
                
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {
                        console.log('Event:', event, data);
                    }
                );
                
                // Clear selection
                await API.viewer.setSelection([]);
                
                highlightedFloors = [];
                document.getElementById('floorEdgesList').innerHTML = '';
                
                messageDiv.className = 'success';
                messageDiv.textContent = '✓ Highlight is gereset';
                
            } catch (error) {
                messageDiv.className = 'error';
                messageDiv.textContent = `Fout bij reset: ${error.message}`;
                console.error('Error:', error);
            }
        }
        
        // Isoleer geselecteerde elementen
        async function isolateSelected() {
            const resultDiv = document.getElementById('result');
            const messageDiv = document.getElementById('message');
            
            try {
                resultDiv.classList.add('show');
                messageDiv.className = 'loading';
                messageDiv.textContent = 'Isoleren...';
                
                if (highlightedFloors.length === 0) {
                    messageDiv.className = 'error';
                    messageDiv.textContent = 'Geen elementen gemarkeerd. Klik eerst op "Highlighten SLAB & ROOF"';
                    return;
                }
                
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {
                        console.log('Event:', event, data);
                    }
                );
                
                const ids = highlightedFloors.map(f => f.id);
                await API.viewer.isolateEntities(ids);
                
                messageDiv.className = 'success';
                messageDiv.textContent = `✓ ${ids.length} elementen zijn geïsoleerd`;
                
            } catch (error) {
                messageDiv.className = 'error';
                messageDiv.textContent = `Fout: ${error.message}`;
                console.error('Error:', error);
            }
        }
        
        // Display floor list
        function displayFloorList(slabs = highlightedFloors) {
            const listDiv = document.getElementById('floorEdgesList');
            
            if (!slabs || slabs.length === 0) {
                listDiv.innerHTML = '';
                return;
            }
            
            let html = `<h3>Gemarkeerde Elementen (${slabs.length}):</h3>`;
            slabs.slice(0, 30).forEach(item => {
                html += `
                    <div class="floor-item highlighted">
                        <strong>${item.name}</strong>
                        <small>(Type: ${item.type})</small>
                    </div>
                `;
            });
            
            if (slabs.length > 30) {
                html += `<div style="padding: 10px; text-align: center; color: #666;">... en ${slabs.length - 30} meer</div>`;
            }
            
            listDiv.innerHTML = html;
        }
    </script>
</body>
</html>
