<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trimble Connect - Object Properties via API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin: 5px;
        }
        #debug {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 20px;
            border-radius: 3px;
            max-height: 700px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            white-space: pre-wrap;
            line-height: 1.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trimble Connect - Object Properties via API</h1>
        <button onclick="inspectObjectProperties()">🔍 Inspecteer Object Properties via API</button>
        <button onclick="clearDebug()">🗑️ Leeg</button>
        
        <div id="debug"></div>
    </div>

    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    
    <script>
        function addDebug(text) {
            const debugDiv = document.getElementById('debug');
            debugDiv.textContent += text + '\n';
            debugDiv.scrollTop = debugDiv.scrollHeight;
        }
        
        function clearDebug() {
            document.getElementById('debug').textContent = '';
        }
        
        async function inspectObjectProperties() {
            clearDebug();
            addDebug('=== OBJECT PROPERTIES VIA API ===\n');
            
            try {
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {
                        console.log('Event:', event, data);
                    }
                );
                
                // Haal alle objecten op
                const allObjects = await API.viewer.getObjects();
                const nestedObjects = allObjects[0].objects;
                
                addDebug(`Totaal objecten: ${nestedObjects.length}`);
                addDebug('Laden van properties...\n');
                
                // Haal properties voor eerste 20 objecten
                const samplesToCheck = 20;
                const propertyMap = new Map();
                
                for (let i = 0; i < Math.min(samplesToCheck, nestedObjects.length); i++) {
                    const objId = nestedObjects[i].id;
                    
                    try {
                        const props = await API.viewer.getObjectProperties(objId);
                        
                        if (props && props.length > 0) {
                            addDebug(`\n=== Object ID ${objId} ===`);
                            addDebug(`Properties count: ${props.length}`);
                            
                            props.forEach(prop => {
                                addDebug(`  ${prop.name}: ${prop.value}`);
                                
                                // Track property names
                                if (!propertyMap.has(prop.name)) {
                                    propertyMap.set(prop.name, []);
                                }
                                propertyMap.get(prop.name).push(prop.value);
                            });
                        } else {
                            addDebug(`\nObject ID ${objId}: Geen properties`);
                        }
                    } catch (e) {
                        addDebug(`\nObject ID ${objId}: Fout - ${e.message}`);
                    }
                }
                
                // Samenvattting
                addDebug('\n\n=== PROPERTY SUMMARY ===\n');
                for (const [propName, values] of propertyMap) {
                    const uniqueValues = [...new Set(values)];
                    addDebug(`${propName}: ${uniqueValues.slice(0, 5).join(', ')}${uniqueValues.length > 5 ? '...' : ''}`);
                }
                
                // Zoek naar floor/slab property values
                addDebug('\n\n=== FLOOR/SLAB SEARCH ===\n');
                for (const [propName, values] of propertyMap) {
                    const floorLikeValues = values.filter(v => 
                        String(v).toLowerCase().includes('floor') ||
                        String(v).toLowerCase().includes('slab') ||
                        String(v).toLowerCase().includes('vloer') ||
                        String(v).toLowerCase().includes('niveau')
                    );
                    
                    if (floorLikeValues.length > 0) {
                        addDebug(`\n${propName}: ${floorLikeValues.slice(0, 10).join(', ')}`);
                    }
                }
                
            } catch (error) {
                addDebug(`✗ FOUT: ${error.message}`);
                addDebug(`Stack: ${error.stack}`);
                console.error(error);
            }
        }
    </script>
</body>
</html>
