<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trimble Connect - Nested Objects Debug</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin: 5px;
        }
        #debug {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 20px;
            border-radius: 3px;
            max-height: 700px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            white-space: pre-wrap;
            line-height: 1.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trimble Connect - Nested Objects Inspector</h1>
        <button onclick="inspectNestedObjects()">🔍 Inspecteer Nested Objects</button>
        <button onclick="clearDebug()">🗑️ Leeg</button>
        
        <div id="debug"></div>
    </div>

    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    
    <script>
        function addDebug(text) {
            const debugDiv = document.getElementById('debug');
            debugDiv.textContent += text + '\n';
            debugDiv.scrollTop = debugDiv.scrollHeight;
        }
        
        function clearDebug() {
            document.getElementById('debug').textContent = '';
        }
        
        async function inspectNestedObjects() {
            clearDebug();
            addDebug('=== NESTED OBJECTS INSPECTIE ===\n');
            
            try {
                const API = await TrimbleConnectWorkspace.connect(
                    window.parent,
                    (event, data) => {
                        console.log('Event:', event, data);
                    }
                );
                
                // Haal alle objecten op
                const allObjects = await API.viewer.getObjects();
                addDebug(`Totaal objecten (top level): ${allObjects.length}`);
                
                if (allObjects.length === 0) {
                    addDebug('Geen objecten gevonden!');
                    return;
                }
                
                // Controleer het eerste object
                const firstObj = allObjects[0];
                addDebug(`\nEerste object properties: modelId, objects`);
                addDebug(`objects array length: ${firstObj.objects.length}\n`);
                
                // Inspecteer nested objects
                addDebug('=== EERSTE 10 NESTED OBJECTS ===\n');
                for (let i = 0; i < Math.min(10, firstObj.objects.length); i++) {
                    const obj = firstObj.objects[i];
                    addDebug(`\nNested Object ${i}:`);
                    
                    for (const [key, value] of Object.entries(obj)) {
                        if (typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') {
                            addDebug(`  ${key}: ${value}`);
                        } else if (Array.isArray(value)) {
                            addDebug(`  ${key}: [Array(${value.length})]`);
                        } else if (typeof value === 'object' && value !== null) {
                            addDebug(`  ${key}: ${JSON.stringify(value)}`);
                        }
                    }
                }
                
                // Analyseer alle nested properties
                addDebug('\n\n=== PROPERTY ANALYSE NESTED ===\n');
                const allProperties = new Set();
                firstObj.objects.forEach(obj => {
                    Object.keys(obj).forEach(key => allProperties.add(key));
                });
                
                addDebug(`Alle unieke properties: ${Array.from(allProperties).join(', ')}\n`);
                
                // Controleer op floor/slab termen
                addDebug('=== ZOEKEN NAAR FLOOR/SLAB TERMEN ===\n');
                const floorLikeObjects = firstObj.objects.filter(obj => {
                    const stringified = JSON.stringify(obj).toLowerCase();
                    return stringified.includes('floor') || 
                           stringified.includes('slab') || 
                           stringified.includes('niveau') ||
                           stringified.includes('verdieping') ||
                           stringified.includes('vloer');
                });
                
                addDebug(`Gevonden ${floorLikeObjects.length} objecten met floor/slab termen\n`);
                
                floorLikeObjects.slice(0, 3).forEach((obj, i) => {
                    addDebug(`\nFloor-like object ${i}:`);
                    for (const [key, value] of Object.entries(obj)) {
                        if (typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') {
                            addDebug(`  ${key}: ${value}`);
                        }
                    }
                });
                
                // Toon value samples
                addDebug('\n\n=== VALUE VOORBEELDEN ===\n');
                const importantProps = ['name', 'type', 'ifc_type', 'ifcType', 'category', 'description', 'classname', 'className', 'externalId'];
                importantProps.forEach(prop => {
                    const values = [...new Set(firstObj.objects.map(o => o[prop]).filter(v => v))];
                    if (values.length > 0) {
                        addDebug(`${prop}: ${values.slice(0, 5).join(', ')}${values.length > 5 ? '...' : ''}`);
                    }
                });
                
            } catch (error) {
                addDebug(`✗ FOUT: ${error.message}`);
                addDebug(`Stack: ${error.stack}`);
                console.error(error);
            }
        }
    </script>
</body>
</html>
